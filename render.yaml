# Render Infrastructure Blueprint for CareerHub Backend Web Service
services:
  - type: web
    name: careerhub-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ALLOW_IN_MEMORY_FALLBACK
        value: "false"
